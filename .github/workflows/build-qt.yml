name: Release Build (Qt)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Desktop (Qt) — Windows (.zip/.exe), macOS (.dmg), Linux (AppImage/.deb)
  # Same release pipeline and signing as the Tauri build.
  # ---------------------------------------------------------------------------
  build-qt-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          # macos-15's SDK dropped the AGL framework Qt's OpenGL wrapper still links.
          - os: macos-14
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Qt 6.8 everywhere (6.7 links the AGL framework newer macOS SDKs dropped): Ubuntu's apt only has Qt 6.2, which is too old, and
      # the Linux packages bundle this Qt so they run on any distro.
      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential patchelf file librsvg2-dev libssl-dev \
            libx11-dev libdbus-1-dev libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libfuse2 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 \
            libcups2-dev libvulkan-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          # WebEngine (PrintSupport needs CUPS on Linux) needs Positioning and WebChannel at configure time.
          modules: 'qtwebengine qtwebchannel qtpositioning qtserialport'
          cache: true

      - name: Configure
        working-directory: desktop-QT
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build (Linux)
        if: matrix.name == 'linux'
        working-directory: desktop-QT/build
        run: cmake --build . --config Release --parallel $(nproc)

      - name: Build (Windows)
        if: matrix.name == 'windows'
        working-directory: desktop-QT/build
        run: cmake --build . --config Release --parallel

      - name: Build (macOS)
        if: matrix.name == 'macos'
        working-directory: desktop-QT/build
        run: cmake --build . --config Release --parallel $(sysctl -n hw.ncpu)

      # ── Linux packaging ──────────────────────────────────────────────────────
      - name: Create Linux AppImage
        if: matrix.name == 'linux'
        working-directory: desktop-QT
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          mkdir -p icon && cp src/resources/icons/app-icon.png icon/serikacord.png
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:${LD_LIBRARY_PATH:-}"
          export EXTRA_QT_MODULES="webenginecore;webenginewidgets;webchannel;positioning"
          export EXTRA_QT_PLUGINS="$EXTRA_QT_MODULES"
          export OUTPUT="SerikaCord-${VERSION}-qt.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -e build/SerikaCord -d serikacord.desktop -i icon/serikacord.png \
            --plugin qt --output appimage
          ls -la "$OUTPUT"

      # The .deb ships the same bundled AppDir under /opt, so it doesn't depend
      # on the distro's (older) Qt.
      - name: Create Linux .deb
        if: matrix.name == 'linux'
        working-directory: desktop-QT
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          PKG="deb-pkg/serikacord-qt_${VERSION}_amd64"
          mkdir -p "$PKG/DEBIAN" "$PKG/opt" "$PKG/usr/bin" "$PKG/usr/share/applications" "$PKG/usr/share/icons/hicolor/256x256/apps"
          cp -a AppDir "$PKG/opt/serikacord"
          ln -s /opt/serikacord/usr/bin/SerikaCord "$PKG/usr/bin/SerikaCord"
          cp serikacord.desktop "$PKG/usr/share/applications/"
          cp src/resources/icons/app-icon.png "$PKG/usr/share/icons/hicolor/256x256/apps/serikacord.png"
          cat > "$PKG/DEBIAN/control" << EOF
          Package: serikacord-qt
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: SerikaCord <dev@serika.chat>
          Description: SerikaCord desktop app
          Depends: libnss3, libxkbcommon-x11-0, libxcb-cursor0, libgl1, libasound2 | libasound2t64
          EOF
          sed -i 's/^          //' "$PKG/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$PKG"

      - name: Sign AppImage (GPG)
        if: matrix.name == 'linux'
        env:
          APPIMAGE_GPG_KEY: ${{ secrets.APPIMAGE_GPG_KEY }}
          APPIMAGE_GPG_PASSPHRASE: ${{ secrets.APPIMAGE_GPG_PASSPHRASE }}
        run: |
          if [ -z "$APPIMAGE_GPG_KEY" ]; then
            echo "APPIMAGE_GPG_KEY secret not set — skipping AppImage signing"
            exit 0
          fi
          echo "$APPIMAGE_GPG_KEY" | gpg --batch --import --pinentry-mode loopback --passphrase "$APPIMAGE_GPG_PASSPHRASE" 2>/dev/null
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          APPIMAGE="desktop-QT/SerikaCord-${VERSION}-qt.AppImage"
          if [ ! -f "$APPIMAGE" ]; then
            echo "No AppImage found — skipping signing"
            exit 0
          fi
          echo "Signing: $APPIMAGE"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$APPIMAGE_GPG_PASSPHRASE" \
            --detach-sign --armor "$APPIMAGE"
          gpg --verify "${APPIMAGE}.asc" "$APPIMAGE" && echo "Signature verified OK"

      # ── Windows packaging ────────────────────────────────────────────────────
      - name: Package Windows
        if: matrix.name == 'windows'
        shell: bash
        working-directory: desktop-QT/build
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          mkdir package
          cp Release/SerikaCord.exe package/
          windeployqt Release/SerikaCord.exe --dir package/ --release --no-translations
          cd package
          7z a "SerikaCord-${VERSION}-qt-windows.zip" .

      # ── macOS packaging ──────────────────────────────────────────────────────
      - name: Package macOS
        if: matrix.name == 'macos'
        working-directory: desktop-QT/build
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # CMake already builds the SerikaCord.app bundle (MACOSX_BUNDLE).
          test -x SerikaCord.app/Contents/MacOS/SerikaCord
          mkdir -p SerikaCord.app/Contents/Resources
          cp ../src/resources/icons/app-icon.png SerikaCord.app/Contents/Resources/
          macdeployqt SerikaCord.app
          hdiutil create -volname "SerikaCord" -srcfolder SerikaCord.app -ov -format UDZO "SerikaCord-${VERSION}-qt.dmg"

      # ── Upload artifacts ──────────────────────────────────────────────────────
      - name: Upload Linux artifacts
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: qt-desktop-linux
          path: |
            desktop-QT/SerikaCord-*-qt.AppImage
            desktop-QT/SerikaCord-*-qt.AppImage.asc
            desktop-QT/deb-pkg/*.deb
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Windows artifacts
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: qt-desktop-windows
          path: desktop-QT/build/package/*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Upload macOS artifacts
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: qt-desktop-macos
          path: desktop-QT/build/*.dmg
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Publish GitHub Release with Qt artifacts
  # ---------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-qt-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: ls -R artifacts || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: SerikaCord Qt ${{ inputs.tag || github.ref_name }}
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, 'beta') || contains(inputs.tag || github.ref_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
